version: 2
project: IPAS - IUS PUNIENDI
flows:
  acceso:
    name: Acceso y sesión
    description: Disponibilidad, autenticación y validación de sesión.
    type: funcional
  gestion_juridica:
    name: Gestión jurídica
    description: Seguimiento público, expedientes y documentos.
    type: funcional
  seguridad:
    name: Seguridad y permisos
    description: Autorización por rol y defectos de acceso controlados.
    type: funcional
  integral:
    name: Flujo integral y regresión
    description: Recorridos E2E y verificación estable del sistema.
    type: funcional
  rendimiento:
    name: Rendimiento
    description: Carga moderada sobre la API local de QA.
    type: no_funcional
suites:
  smoke:
    name: Smoke
    description: Disponibilidad mínima y acceso válido.
    flow: acceso
  autenticacion:
    name: Login y autenticación
    description: Credenciales, campos obligatorios y verificación JWT.
    flow: acceso
  consulta_publica:
    name: Seguimiento público
    description: Consulta protegida mediante NUREJ/CUD y CI.
    flow: gestion_juridica
  expedientes:
    name: Gestión de expedientes
    description: Creación, validaciones y consulta de casos.
    flow: gestion_juridica
  documentos:
    name: Gestión de documentos
    description: Archivos válidos, extensiones rechazadas y valor límite de 10 MB.
    flow: gestion_juridica
  roles:
    name: Roles y permisos
    description: Restricciones de acceso del lado servidor.
    flow: seguridad
  e2e:
    name: E2E jurídico
    description: Login y visualización del expediente ficticio.
    flow: integral
  regression:
    name: Regresión funcional
    description: Todos los casos estables; excluye el FAIL controlado.
    flow: integral
  controlled_fail:
    name: FAIL controlado
    description: Caso conocido que demuestra la detección de un defecto real.
    flow: seguridad
  carga_local:
    name: Carga local de API
    description: Login y consultas de expedientes/documentos con carga moderada exclusivamente local.
    type: no_funcional
    flow: rendimiento
cases:
  - id: TC-SMK-001
    name: Disponibilidad integral de IPAS QA
    type: funcional
    module: infraestructura local
    priority: Alta
    suites: [smoke, regression]
    nodeid: tests/api/test_health_contract.py::test_ipas_local_health
  - id: TC-LOG-001
    name: Login válido de abogado desde la interfaz
    type: funcional
    module: autenticación
    priority: Alta
    suites: [smoke, autenticacion, regression]
    nodeid: tests/functional/test_login_smoke.py::test_login_abogado_valido
  - id: TC-LOG-002
    name: Rechazo de contraseña incorrecta
