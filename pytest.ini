[pytest]
testpaths = tests
addopts = -ra
markers =
    case_id(id): identificador trazable del caso de prueba
    smoke: validaciones mínimas de disponibilidad
    functional: pruebas funcionales de interfaz
    api: pruebas directas de API
    login: suite de autenticación
    public: consulta pública de seguimiento
    expedientes: gestión de casos/expedientes
    documentos: carga y validación de documentos
    roles: autorización por rol
    e2e: flujo completo entre módulos
    controlled_fail: caso negativo conocido y trazado a defecto


